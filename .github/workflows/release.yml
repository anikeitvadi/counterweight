name: Release

# Builds the desktop apps for a version tag and attaches them (plus the update manifests) to the GitHub release.
# Signing is optional: when the secrets below exist the builds are signed (and notarised on macOS); without them
# the artifacts are unsigned and first launch shows SmartScreen / Gatekeeper prompts, exactly as before.
#   Windows:  CSC_LINK (base64 .pfx), CSC_KEY_PASSWORD
#   macOS:    CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One release, created up front as a draft: when both build jobs find no release they each create one, and the
  # files split across two releases with the same tag (v0.3.1 did this; Windows ended up off "latest"). It is
  # published only after both builds have uploaded, so "latest" never points at a release without its files.
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "${TAG#v}" --notes "See CHANGELOG.md." --target "$GITHUB_SHA"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis zip --x64
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # GitHub hands unset secrets to the job as empty strings; electron-builder would read an empty CSC_LINK as
      # "sign with this" and fail. Export the signing variables only when they are actually set.
      - name: Signing secrets (only when present)
        shell: bash
        env:
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$S_CSC_LINK" ]; then
            echo "CSC_LINK=$S_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$S_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            # Without a certificate, ad-hoc sign the Mac app. Left unsigned, the Apple silicon build carries only the
            # linker's stub signature, which fails verification, so macOS calls the download "damaged" and refuses it.
            echo "EB_EXTRA=-c.mac.identity=-" >> "$GITHUB_ENV"
          fi
          if [ -n "$S_APPLE_ID" ]; then
            echo "APPLE_ID=$S_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$S_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$S_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - name: Package and publish
        shell: bash
        run: npx electron-builder ${{ matrix.args }} $EB_EXTRA --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --draft=false --latest
